[package]
name = "xml-xsd2"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "libxml_xsdx2"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"

[[bin]]
name = "xml-xsd2"
path = "src/main.rs"
