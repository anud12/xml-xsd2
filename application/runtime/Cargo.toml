[package]
name = "xml-xsd2"
version = "0.1.0"
edition = "2021"

[lib]
name = "libxml_xsd2"
crate-type = ["cdylib"]

[[test]]
name = "java_junit_suite"
path = "test/java_tests.rs"
harness = false

[dependencies]
anyhow = "1.0.102"
rusqlite = { version = "0.39.0", features = ["bundled", "backup"] }
thiserror = "2.0.18"
walkdir = "2.5.0"
zip = "8.4.0"
# QuickJS bindings for embedded JS runtime
rquickjs = { version = "0.10", features = ["loader", "classes"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"

base64 = "0.21"
